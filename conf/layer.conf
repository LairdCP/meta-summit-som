# We have a conf and classes directory, add to BBPATH
BBPATH =. "${LAYERDIR}:"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	   ${LAYERDIR}/recipes-*/*/*.bbappend"

RFPROS_FILESHARE_AUTH ?= ""

BBFILE_COLLECTIONS += "summit-som"
BBFILE_PATTERN_summit-som = "^${LAYERDIR}/"
BBFILE_PRIORITY_summit-som = "9"

LAYERSERIES_COMPAT_summit-som = "scarthgap"

BB_DANGLINGAPPENDS_WARNONLY = "1"

UBOOT_SIGN_KEYDIR := "${LAYERDIR}/keys"

PREMIRRORS:prepend = "https://github.com/Ezurio/Sterling-LWB-and-LWB5-Release-Packages/releases/download/.*/.*     file://${TOPDIR}/../release \n"

BBFILES_DYNAMIC += " \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/imx/*/*/*.bb \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/imx/*/*/*.bbappend \
    meta-ti-bsp:${LAYERDIR}/dynamic-layers/ti/*/*/*.bb \
    meta-ti-bsp:${LAYERDIR}/dynamic-layers/ti/*/*/*.bbappend \
    "
