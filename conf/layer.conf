# We have a conf and classes directory, add to BBPATH
BBPATH =. "${LAYERDIR}:"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	   ${LAYERDIR}/recipes-*/*/*.bbappend"

RFPROS_FILESHARE_AUTH ?= ""

BBFILE_COLLECTIONS += "summit-som"
BBFILE_PATTERN_summit-som = "^${LAYERDIR}/"
BBFILE_PRIORITY_summit-som = "9"

LAYERSERIES_COMPAT_summit-som = "walnascar"

UBOOT_SIGN_KEYDIR := "${LAYERDIR}/keys"
META_SUMMIT_SOM_PATH = "${LAYERDIR}"

BBFILES_DYNAMIC += " \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/imx/*/*/*.bb \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/imx/*/*/*.bbappend \
    meta-ti-bsp:${LAYERDIR}/dynamic-layers/ti/*/*/*.bb \
    meta-ti-bsp:${LAYERDIR}/dynamic-layers/ti/*/*/*.bbappend \
    "

BBMASK += " \
    meta-imx-bsp/recipes-security/parsec-service \
    meta-imx-bsp/recipes-devtools/clang \
    meta-imx-bsp/recipes-core/systemd/systemd_%.bbappend \
    meta-imx-sdk/recipes-core/systemd \
    "

ERROR_QA:remove:summit-som = "patch-status"
